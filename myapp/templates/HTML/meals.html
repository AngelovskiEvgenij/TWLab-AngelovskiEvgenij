{% load static %}
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retete (API) - Lab 9</title>
    <link rel="stylesheet" href="{% static 'CSS/home_style.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/meals_style.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/cursor.css' %}">
</head>
<body>

<header>
    <div class="container">
        <h1>Comunitatea de TW 2026</h1>
        <nav>
            <a href="{% url 'home' %}">Acasa</a>
            <a href="{% url 'universities' %}">Universitati</a>
            <a href="{% url 'galerie' %}">Galerie</a>
            <a href="{% url 'meals' %}">Retete</a>
            <a href="{% url 'chatbot' %}">Chatbot</a>
            <a href="{% url 'login' %}">Logout</a>
        </nav>
    </div>
</header>

<main class="container">
    <section class="meals-section">
        <h1>Căutare rețete internaționale folosind TheMealDB API</h1>

        <form id="searchForm">
            <input id="queryInput" type="text" placeholder="Cauta o reteta...">
            <button id="searchBtn" type="submit" class="btn">Search</button>
        </form>

        <p id="status" aria-live="polite"></p>

        <div id="results"></div>
    </section>
</main>

<footer>
    <div class="container">
        <p>&copy; Comunitatea de TW 2026</p>
        <p>
            <a href="https://www.uvt.ro">Universitatea de Vest din Timisoara</a> |
            <a href="https://info.uvt.ro">Facultatea de Informatica</a>
        </p>
    </div>
</footer>

<script src="{% static 'JS/meals.js' %}"></script>
<script src="{% static 'TS/cursor.js' %}"></script>
</body>
</html>
