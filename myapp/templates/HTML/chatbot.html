{% load static %}
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot</title>
  <link rel="stylesheet" href="{% static 'CSS/home_style.css' %}">
  <link rel="stylesheet" href="{% static 'CSS/chatbot_style.css' %}">
</head>
<body>

<header>
  <div class="container">
    <h1>Comunitatea de TW 2026</h1>
    <nav>
      <a href="{% url 'home' %}">Acasa</a>
      <a href="{% url 'universities' %}">Universitati</a>
      <a href="{% url 'galerie' %}">Galerie</a>
      <a href="{% url 'meals' %}">Retete</a>
      <a href="{% url 'chatbot' %}">Chatbot</a>
      <a href="{% url 'login' %}">Logout</a>
    </nav>
  </div>
</header>

<main class="container chatbot-wrapper">
  <div class="chat-container" id="chat-container"></div>
  <form id="chat-form">
    <input type="text" id="user-input" placeholder="Scrie a, b sau c..." autocomplete="off" required>
    <button type="submit">Trimite</button>
  </form>
</main>

<script src="{% static 'JS/chatbot_js.js' %}"></script>
</body>
</html>
